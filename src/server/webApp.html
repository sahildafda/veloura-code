<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Veloura Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    :root {
      --bg-sidebar: #171717;
      --bg-main: #212121;
      --bg-input: #2f2f2f;
      --bg-hover: #262626;
      --bg-card: #1e1e1e;
      --border-subtle: #333333;
      --border-focus: #555555;
      --text-main: #ececec;
      --text-muted: #8e8e8e;
      --accent-green: #10a37f;
      --accent-green-hover: #1a7f64;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* === SIDEBAR (ChatGPT Style) === */
    .sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      user-select: none;
      transition: width 0.2s ease;
    }

    .sidebar-header {
      padding: 14px 12px 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #10a37f 0%, #06b6d4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }

    .brand-title {
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.2px;
      color: var(--text-main);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .new-chat-btn:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-focus);
    }

    .conversations-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .conversations-list::-webkit-scrollbar {
      width: 4px;
    }

    .conversations-list::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--text-main);
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease;
      position: relative;
    }

    .conv-item:hover {
      background-color: var(--bg-hover);
    }

    .conv-item.active {
      background-color: var(--bg-input);
      font-weight: 500;
    }

    .conv-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .conv-delete-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .conv-item:hover .conv-delete-btn {
      display: block;
    }

    .conv-delete-btn:hover {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    /* === PROFILE & FOOTER SECTION === */
    .sidebar-footer {
      padding: 12px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .profile-card:hover {
      background-color: var(--bg-hover);
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #3f3f46;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fafafa;
      font-weight: 600;
      font-size: 13px;
    }

    .profile-details {
      display: flex;
      flex-direction: column;
      flex: 1;
      overflow: hidden;
    }

    .profile-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-project {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* === MAIN CHAT AREA === */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
      background-color: var(--bg-main);
    }

    /* Top Navigation Bar */
    .top-bar {
      height: 54px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      background-color: var(--bg-main);
      z-index: 10;
    }

    .model-selector-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-dropdown {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
    }

    .model-dropdown:focus {
      border-color: var(--accent-green);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-chip {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .action-chip:hover {
      background: var(--bg-hover);
      border-color: var(--border-focus);
    }

    .badge-git {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #27272a;
      color: #a1a1aa;
      border: 1px solid #3f3f46;
    }

    /* Chat Messages Stream */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0 140px 0;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    .message-row {
      display: flex;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px;
      gap: 16px;
    }

    .message-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
    }

    .avatar-user {
      background-color: #52525b;
      color: white;
    }

    .avatar-ai {
      background: linear-gradient(135deg, #10a37f 0%, #06b6d4 100%);
      color: white;
    }

    .message-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-main);
      overflow-x: auto;
    }

    .message-sender-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Markdown Styling */
    .message-body h1, .message-body h2, .message-body h3 {
      margin-top: 14px;
      margin-bottom: 8px;
      color: #fafafa;
      letter-spacing: -0.2px;
    }

    .message-body p {
      margin-bottom: 10px;
    }

    .message-body ul, .message-body ol {
      margin-left: 20px;
      margin-bottom: 10px;
    }

    .message-body li {
      margin-bottom: 4px;
    }

    .message-body pre {
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      margin: 12px 0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .message-body code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      background-color: #27272a;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .message-body pre code {
      background-color: transparent;
      padding: 0;
    }

    .message-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 13.5px;
    }

    .message-body th, .message-body td {
      border: 1px solid #333;
      padding: 8px 12px;
      text-align: left;
    }

    .message-body th {
      background-color: #27272a;
      font-weight: 600;
    }

    /* Tool Activity Card */
    .tool-activity-box {
      background-color: #1c1c1f;
      border: 1px solid #2c2c30;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 8px;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .tool-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 12px;
    }

    .tool-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #d4d4d8;
    }

    .tool-status-icon {
      font-weight: bold;
    }

    .tool-success { color: #10a37f; }
    .tool-running { color: #06b6d4; }
    .tool-failure { color: #ef4444; }

    /* Welcome / Empty Screen */
    .empty-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
      padding: 20px;
      gap: 20px;
    }

    .empty-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #10a37f 0%, #06b6d4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: white;
      box-shadow: 0 4px 20px rgba(16, 163, 127, 0.3);
    }

    .empty-title {
      font-size: 24px;
      font-weight: 600;
      color: var(--text-main);
    }

    .starters-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-top: 10px;
    }

    .starter-card {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .starter-card:hover {
      background-color: var(--bg-hover);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }

    .starter-card-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
    }

    .starter-card-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Fixed Bottom Input Area */
    .bottom-input-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 24px 20px 24px;
      background: linear-gradient(to top, var(--bg-main) 70%, rgba(33, 33, 33, 0));
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 20;
    }

    .input-box-container {
      width: 100%;
      max-width: 820px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      transition: border-color 0.15s ease;
    }

    .input-box-container:focus-within {
      border-color: var(--border-focus);
    }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.5;
      resize: none;
      outline: none;
      max-height: 180px;
      min-height: 24px;
    }

    .chat-textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: white;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: black;
      flex-shrink: 0;
      transition: opacity 0.15s ease;
    }

    .send-btn:disabled {
      background-color: #3f3f46;
      color: #71717a;
      cursor: not-allowed;
    }

    .input-disclaimer {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Spinner Animation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .spinner-icon {
      display: inline-block;
      animation: spin 1s linear infinite;
    }

    /* Rate Limit Diagnostic Box */
    .rate-limit-box {
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
      padding: 18px 20px;
      margin: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 760px;
    }
    .rate-limit-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      color: #fbbf24;
    }
    .rate-limit-body {
      font-size: 13.5px;
      color: var(--text-main);
      line-height: 1.6;
    }
    .rate-limit-actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-top: 6px;
    }
    .rate-action-btn {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 12.5px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .rate-action-btn:hover {
      background: var(--bg-hover);
      border-color: #fbbf24;
      transform: translateY(-1px);
    }
    .rate-action-btn.primary {
      background: rgba(16, 163, 127, 0.15);
      border-color: rgba(16, 163, 127, 0.4);
      color: #34d399;
    }
    .rate-action-btn.primary:hover {
      background: rgba(16, 163, 127, 0.25);
    }

    /* Settings Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .modal-content {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      width: 90%;
      max-width: 520px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }
    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
    }
    .form-hint {
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .form-input {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    .form-input:focus {
      border-color: var(--border-focus);
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--border-subtle);
      padding-top: 14px;
    }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-row">
        <div class="brand-logo">✦</div>
        <div class="brand-title">Veloura Code</div>
      </div>
      <button class="new-chat-btn" id="newChatBtn">
        <span>+ New chat</span>
        <span style="font-size: 11px; color: var(--text-muted);">Ctrl+K</span>
      </button>
    </div>

    <!-- Scrollable Conversations List -->
    <div class="conversations-list" id="convList">
      <!-- Injected via JavaScript -->
    </div>

    <!-- Profile & Workspace Details at Bottom -->
    <div class="sidebar-footer">
      <div class="profile-card" id="profileBtn" onclick="openSettingsModal()" title="Current Profile & Settings">
        <div class="profile-avatar" id="avatarInitial">U</div>
        <div class="profile-details">
          <div class="profile-name" id="profileUsername">User</div>
          <div class="profile-project" id="profileProjectName">Project</div>
        </div>
        <span style="color: var(--text-muted); font-size: 16px;">⚙</span>
      </div>
    </div>
  </aside>

  <!-- MAIN CHAT APPLICATION AREA -->
  <main class="main-content">
    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="model-selector-wrap">
        <select class="model-dropdown" id="modelSelect">
          <optgroup label="🌟 Free Tier Models (Subject to daily limit)">
            <option value="qwen/qwen-2.5-coder-32b-instruct:free">Qwen 2.5 Coder 32B (Free Coding)</option>
            <option value="meta-llama/llama-3.3-70b-instruct:free">Llama 3.3 70B Instruct (Free Reasoning)</option>
            <option value="google/gemini-2.0-flash-exp:free">Gemini 2.0 Flash Exp (Free 1M)</option>
            <option value="deepseek/deepseek-r1:free">DeepSeek R1 (Free Reasoning)</option>
            <option value="mistralai/mistral-small-24b-instruct-2501:free">Mistral Small 24B (Free Compact)</option>
            <option value="openrouter/free">OpenRouter Free (Auto-Router)</option>
          </optgroup>
          <optgroup label="⚡ Ultra-Low Cost (~$0.0001/call - No Free Limit)">
            <option value="google/gemini-2.0-flash-001">Google Gemini 2.0 Flash ($0.10/M tokens)</option>
            <option value="deepseek/deepseek-chat">DeepSeek V3 Chat ($0.14/M tokens)</option>
            <option value="openai/gpt-4o-mini">OpenAI GPT-4o Mini ($0.15/M tokens)</option>
            <option value="meta-llama/llama-3.1-8b-instruct">Meta Llama 3.1 8B ($0.055/M tokens)</option>
          </optgroup>
          <optgroup label="👑 Premium Flagship Models">
            <option value="anthropic/claude-3.5-sonnet">Claude 3.5 Sonnet</option>
            <option value="openai/gpt-4o">OpenAI GPT-4o</option>
            <option value="deepseek/deepseek-r1">DeepSeek R1 Full</option>
          </optgroup>
        </select>
        <span class="badge-git" id="gitBadge">Git: checking...</span>
      </div>

      <div class="top-actions">
        <button class="action-chip" id="btnGenDocs" title="Create documentation file in project">
          <span>📖 Generate Docs</span>
        </button>
        <button class="action-chip" id="btnDiff" title="View active code changes">
          <span>⌥ Diff</span>
        </button>
        <button class="action-chip" id="btnCheckpoint" title="Create Git Checkpoint">
          <span>💾 Checkpoint</span>
        </button>
        <button class="action-chip" id="btnSettings" onclick="openSettingsModal()" title="Configure API Key and Provider">
          <span>⚙ Settings</span>
        </button>
      </div>
    </header>

    <!-- Chat Messages Feed -->
    <div class="chat-messages" id="chatFeed">
      <!-- Messages injected here -->
    </div>

    <!-- Fixed Bottom Prompt Box -->
    <div class="bottom-input-wrap">
      <div class="input-box-container">
        <textarea
          id="promptInput"
          class="chat-textarea"
          rows="1"
          placeholder="Ask Veloura to write code, build features, generate documentation, or fix bugs..."
        ></textarea>
        <button id="sendBtn" class="send-btn" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </div>
      <div class="input-disclaimer">
        Veloura Code operates directly on your project files. Checkpoints and changes are saved locally.
      </div>
    </div>
  </main>

  <!-- SETTINGS MODAL -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">⚙️ Veloura Code Settings</div>
        <button class="modal-close-btn" onclick="closeSettingsModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">OpenRouter API Key</label>
          <input type="password" id="settingsApiKey" class="form-input" placeholder="Enter new API key (sk-or-v1-...)" />
          <div class="form-hint" id="settingsKeyStatus">Loading key status...</div>
        </div>

        <div class="form-group">
          <label class="form-label">AI Provider Base URL</label>
          <input type="text" id="settingsBaseUrl" class="form-input" placeholder="https://openrouter.ai/api/v1" />
          <div style="display: flex; gap: 8px; margin-top: 4px;">
            <button type="button" class="action-chip" style="font-size: 11px;" onclick="document.getElementById('settingsBaseUrl').value = 'https://openrouter.ai/api/v1'">OpenRouter Default</button>
            <button type="button" class="action-chip" style="font-size: 11px;" onclick="document.getElementById('settingsBaseUrl').value = 'http://localhost:11434/v1'">Local Ollama (11434)</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Privacy Mode</label>
          <select id="settingsPrivacyMode" class="form-input">
            <option value="standard">Standard (Local filtering of secrets & sensitive files)</option>
            <option value="strict">Strict (Require explicit approval before external AI requests)</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="action-chip" onclick="closeSettingsModal()">Cancel</button>
        <button class="rate-action-btn primary" onclick="saveSettings()">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    // State
    let activeConversationId = null;
    let conversations = [];
    let isGenerating = false;
    let activeTurnTools = [];

    // DOM Elements
    const convListEl = document.getElementById("convList");
    const chatFeedEl = document.getElementById("chatFeed");
    const promptInputEl = document.getElementById("promptInput");
    const sendBtnEl = document.getElementById("sendBtn");
    const modelSelectEl = document.getElementById("modelSelect");
    const newChatBtnEl = document.getElementById("newChatBtn");
    const profileUsernameEl = document.getElementById("profileUsername");
    const profileProjectNameEl = document.getElementById("profileProjectName");
    const avatarInitialEl = document.getElementById("avatarInitial");
    const gitBadgeEl = document.getElementById("gitBadge");

    // Marked config
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // 1. Initial Load
    async function init() {
      await loadProfile();
      await loadProjectInfo();
      await loadConversations();
      
      // Auto-focus input
      promptInputEl.focus();
    }

    async function loadProfile() {
      try {
        const res = await fetch("/api/profile");
        const data = await res.json();
        profileUsernameEl.textContent = data.username || "Developer";
        profileProjectNameEl.textContent = data.projectName || "Workspace";
        avatarInitialEl.textContent = (data.username || "D").charAt(0).toUpperCase();
        if (data.activeModel) {
          modelSelectEl.value = data.activeModel;
        }
      } catch (err) {
        console.error("Profile load error:", err);
      }
    }

    async function loadProjectInfo() {
      try {
        const res = await fetch("/api/project");
        const data = await res.json();
        if (data.git && data.git.isGit) {
          gitBadgeEl.textContent = `Git: ${data.git.branch || "HEAD"} (${data.git.isClean ? "clean" : "modified"})`;
          gitBadgeEl.style.color = data.git.isClean ? "#10a37f" : "#f59e0b";
        } else {
          gitBadgeEl.textContent = "Git: Local Snapshots";
        }
      } catch (err) {
        gitBadgeEl.textContent = "Git: Not detected";
      }
    }

    async function loadConversations() {
      try {
        const res = await fetch("/api/conversations");
        conversations = await res.json();
        renderConversationsList();

        if (conversations.length > 0 && !activeConversationId) {
          selectConversation(conversations[0].id);
        } else if (conversations.length === 0) {
          showEmptyState();
        }
      } catch (err) {
        console.error("Failed to load conversations:", err);
      }
    }

    function renderConversationsList() {
      convListEl.innerHTML = "";
      conversations.forEach((conv) => {
        const item = document.createElement("div");
        item.className = `conv-item ${conv.id === activeConversationId ? "active" : ""}`;
        item.onclick = (e) => {
          if (!e.target.classList.contains("conv-delete-btn")) {
            selectConversation(conv.id);
          }
        };

        const title = document.createElement("span");
        title.className = "conv-title";
        title.textContent = conv.title || "Untitled Chat";

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "conv-delete-btn";
        deleteBtn.innerHTML = "✕";
        deleteBtn.title = "Delete Chat";
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteConversation(conv.id);
        };

        item.appendChild(title);
        item.appendChild(deleteBtn);
        convListEl.appendChild(item);
      });
    }

    async function selectConversation(convId) {
      activeConversationId = convId;
      renderConversationsList();

      try {
        const res = await fetch(`/api/conversations/${convId}`);
        const data = await res.json();
        renderMessages(data.messages || []);
      } catch (err) {
        console.error("Error loading conversation:", err);
      }
    }

    async function deleteConversation(convId) {
      if (!confirm("Are you sure you want to delete this chat?")) return;
      try {
        await fetch(`/api/conversations/${convId}`, { method: "DELETE" });
        if (activeConversationId === convId) {
          activeConversationId = null;
        }
        await loadConversations();
      } catch (err) {
        console.error("Error deleting conversation:", err);
      }
    }

    function renderMessages(messages) {
      chatFeedEl.innerHTML = "";

      const visible = messages.filter(m => m.role === "user" || m.role === "assistant");
      if (visible.length === 0) {
        showEmptyState();
        return;
      }

      visible.forEach(m => {
        appendMessageRow(m.role, m.content, m.tool_calls ? JSON.parse(m.tool_calls) : null);
      });

      scrollToBottom();
    }

    function showEmptyState() {
      chatFeedEl.innerHTML = `
        <div class="empty-screen">
          <div class="empty-logo">✦</div>
          <div class="empty-title">What would you like to build or fix?</div>
          <p style="color: var(--text-muted); font-size: 14px;">
            Veloura Code understands your project architecture, edits code surgically, runs tests, and completes tasks autonomously.
          </p>
          <div class="starters-grid">
            <div class="starter-card" onclick="sendStarter('Generate comprehensive documentation for this codebase in DOCUMENTATION.md')">
              <div class="starter-card-title">📖 Generate Documentation</div>
              <div class="starter-card-desc">Analyze code and write DOCUMENTATION.md</div>
            </div>
            <div class="starter-card" onclick="sendStarter('Analyze project architecture, dependencies, and entry points')">
              <div class="starter-card-title">🔍 Architectural Audit</div>
              <div class="starter-card-desc">Inspect folder structure & dependencies</div>
            </div>
            <div class="starter-card" onclick="sendStarter('Run tests and fix any failing test cases')">
              <div class="starter-card-title">🧪 Run Tests & Auto-Fix</div>
              <div class="starter-card-desc">Execute test suite and resolve failures</div>
            </div>
            <div class="starter-card" onclick="sendStarter('Review code quality and suggest targeted improvements')">
              <div class="starter-card-title">⚡ Code Quality Review</div>
              <div class="starter-card-desc">Identify bugs, security & performance issues</div>
            </div>
          </div>
        </div>
      `;
    }

    window.sendStarter = function(promptText) {
      promptInputEl.value = promptText;
      updateTextareaHeight();
      submitPrompt();
    };

    function appendMessageRow(role, content, tools) {
      const row = document.createElement("div");
      row.className = "message-row";

      const avatar = document.createElement("div");
      avatar.className = `message-avatar ${role === "user" ? "avatar-user" : "avatar-ai"}`;
      avatar.textContent = role === "user" ? "U" : "✦";

      const body = document.createElement("div");
      body.className = "message-body";

      const sender = document.createElement("div");
      sender.className = "message-sender-name";
      sender.textContent = role === "user" ? "You" : "Veloura Code";
      body.appendChild(sender);

      // If tools were executed
      if (tools && tools.length > 0) {
        const toolBox = document.createElement("div");
        toolBox.className = "tool-activity-box";
        toolBox.innerHTML = `
          <div class="tool-header-row">
            <span>⚙ Executed ${tools.length} tool${tools.length > 1 ? "s" : ""}</span>
          </div>
        `;
        tools.forEach(t => {
          const pill = document.createElement("div");
          pill.className = "tool-pill";
          pill.innerHTML = `<span class="tool-status-icon tool-success">✔</span> <b>${t.name}</b> (${JSON.stringify(t.arguments || {}).slice(0, 40)})`;
          toolBox.appendChild(pill);
        });
        body.appendChild(toolBox);
      }

      if (content) {
        const textWrap = document.createElement("div");
        textWrap.innerHTML = marked.parse(content);
        body.appendChild(textWrap);
      }

      row.appendChild(avatar);
      row.appendChild(body);
      chatFeedEl.appendChild(row);
      scrollToBottom();
    }

    // Submit Prompt
    async function submitPrompt() {
      const text = promptInputEl.value.trim();
      if (!text || isGenerating) return;

      promptInputEl.value = "";
      updateTextareaHeight();
      sendBtnEl.disabled = true;
      isGenerating = true;

      // If on empty screen, clear it
      if (chatFeedEl.querySelector(".empty-screen")) {
        chatFeedEl.innerHTML = "";
      }

      // Append User message
      appendMessageRow("user", text);

      // Append Thinking Row
      const thinkingRow = document.createElement("div");
      thinkingRow.className = "message-row";
      thinkingRow.id = "activeThinkingRow";
      thinkingRow.innerHTML = `
        <div class="message-avatar avatar-ai">✦</div>
        <div class="message-body">
          <div class="message-sender-name">Veloura Code</div>
          <div style="display: flex; align-items: center; gap: 8px; color: var(--accent-cyan); font-size: 13.5px;">
            <span class="spinner-icon">⟳</span>
            <span id="thinkingActivityText">Analyzing project context and planning steps...</span>
          </div>
        </div>
      `;
      chatFeedEl.appendChild(thinkingRow);
      scrollToBottom();

      try {
        const selectedModel = modelSelectEl.value;
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: text,
            conversationId: activeConversationId,
            model: selectedModel
          })
        });

        const data = await res.json();
        
        // Remove thinking row
        thinkingRow.remove();

        if (data.rateLimit || (data.error && data.error.includes("free-models-per-day"))) {
          appendRateLimitCard(data.error);
        } else if (data.error) {
          appendMessageRow("assistant", `✕ Error: ${data.error}`);
        } else {
          activeConversationId = data.conversationId;
          appendMessageRow("assistant", data.response, data.toolCalls);
          await loadConversations();
          await loadProjectInfo();
        }
      } catch (err) {
        thinkingRow.remove();
        appendMessageRow("assistant", `✕ Connection error: ${err.message}`);
      } finally {
        isGenerating = false;
        promptInputEl.focus();
      }
    }

    function scrollToBottom() {
      chatFeedEl.scrollTop = chatFeedEl.scrollHeight;
    }

    function updateTextareaHeight() {
      promptInputEl.style.height = "auto";
      promptInputEl.style.height = Math.min(promptInputEl.scrollHeight, 180) + "px";
      sendBtnEl.disabled = promptInputEl.value.trim().length === 0;
    }

    // Event Listeners
    promptInputEl.addEventListener("input", updateTextareaHeight);

    promptInputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitPrompt();
      }
    });

    sendBtnEl.addEventListener("click", submitPrompt);

    newChatBtnEl.addEventListener("click", () => {
      activeConversationId = null;
      renderConversationsList();
      showEmptyState();
      promptInputEl.focus();
    });

    window.addEventListener("keydown", (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === "k") {
        e.preventDefault();
        newChatBtnEl.click();
      }
    });

    // Top action buttons
    document.getElementById("btnGenDocs").addEventListener("click", () => {
      promptInputEl.value = "Create comprehensive documentation for this project and save it to DOCUMENTATION.md and DOCUMENTATION.html";
      updateTextareaHeight();
      submitPrompt();
    });

    document.getElementById("btnDiff").addEventListener("click", () => {
      promptInputEl.value = "/diff";
      updateTextareaHeight();
      submitPrompt();
    });

    document.getElementById("btnCheckpoint").addEventListener("click", () => {
      promptInputEl.value = "Create a checkpoint of the current code changes";
      updateTextareaHeight();
      submitPrompt();
    });

    // === RATE LIMIT & SETTINGS LOGIC ===
    function appendRateLimitCard(errorMsg) {
      const row = document.createElement("div");
      row.className = "message-row";

      const avatar = document.createElement("div");
      avatar.className = "message-avatar avatar-ai";
      avatar.textContent = "⚠️";

      const body = document.createElement("div");
      body.className = "message-body";

      const sender = document.createElement("div");
      sender.className = "message-sender-name";
      sender.textContent = "OpenRouter Quota Alert";
      body.appendChild(sender);

      const box = document.createElement("div");
      box.className = "rate-limit-box";
      box.innerHTML = `
        <div class="rate-limit-header">
          <span>⚠️ Daily Free Limit Exceeded (429 free-models-per-day)</span>
        </div>
        <div class="rate-limit-body">
          OpenRouter has capped your account's daily quota for <b>free models</b> because your credit balance is $0.<br/>
          To continue coding right now, choose one of the options below:
        </div>
        <div class="rate-limit-actions-grid">
          <button class="rate-action-btn primary" onclick="switchToLowCostModel('google/gemini-2.0-flash-001')">
            <span>⚡</span>
            <div>
              <div style="font-weight: 600;">Switch to Gemini 2.0 Flash</div>
              <div style="font-size: 11px; opacity: 0.8;">$0.10/M tokens (~$0.0001/task, no free cap)</div>
            </div>
          </button>
          <button class="rate-action-btn" onclick="switchToLowCostModel('deepseek/deepseek-chat')">
            <span>⚡</span>
            <div>
              <div style="font-weight: 600;">Switch to DeepSeek V3</div>
              <div style="font-size: 11px; opacity: 0.8;">$0.14/M tokens (top coding performance)</div>
            </div>
          </button>
          <button class="rate-action-btn" onclick="openSettingsModal()">
            <span>⚙️</span>
            <div>
              <div style="font-weight: 600;">Update API Key</div>
              <div style="font-size: 11px; opacity: 0.8;">Use another OpenRouter account</div>
            </div>
          </button>
          <button class="rate-action-btn" onclick="switchToOllama()">
            <span>💻</span>
            <div>
              <div style="font-weight: 600;">Switch to Local Ollama</div>
              <div style="font-size: 11px; opacity: 0.8;">100% Free & Unlimited (localhost:11434)</div>
            </div>
          </button>
          <a class="rate-action-btn" href="https://openrouter.ai/credits" target="_blank">
            <span>💳</span>
            <div>
              <div style="font-weight: 600;">Add $10 Credits</div>
              <div style="font-size: 11px; opacity: 0.8;">Unlocks 1,000 free requests/day permanently</div>
            </div>
          </a>
        </div>
      `;
      body.appendChild(box);

      row.appendChild(avatar);
      row.appendChild(body);
      chatFeedEl.appendChild(row);
      scrollToBottom();
    }

    window.switchToLowCostModel = function(modelId) {
      modelSelectEl.value = modelId;
      appendMessageRow("assistant", `Switched active model to **${modelId}**! This model is not subject to the free-tier daily cap. You can now send your message to proceed.`);
    };

    window.switchToOllama = async function() {
      try {
        const res = await fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            baseUrl: "http://localhost:11434/v1",
            defaultModel: "qwen2.5-coder",
            provider: "ollama"
          })
        });
        appendMessageRow("assistant", `Switched to **Local Ollama** (http://localhost:11434/v1) with model **qwen2.5-coder**! Make sure Ollama is running on your machine ('ollama run qwen2.5-coder').`);
      } catch (err) {
        alert("Failed to configure Ollama: " + err.message);
      }
    };

    window.openSettingsModal = async function() {
      try {
        const res = await fetch("/api/settings");
        const data = await res.json();
        document.getElementById("settingsApiKey").placeholder = data.maskedKey || "sk-or-v1-...";
        document.getElementById("settingsBaseUrl").value = data.baseUrl || "https://openrouter.ai/api/v1";
        document.getElementById("settingsPrivacyMode").value = data.privacyMode || "standard";
        document.getElementById("settingsKeyStatus").textContent = data.hasApiKey ? `Key configured (${data.storageSource}): ${data.maskedKey}` : "No API key configured";
      } catch {}
      document.getElementById("settingsModal").classList.add("active");
    };

    window.closeSettingsModal = function() {
      document.getElementById("settingsModal").classList.remove("active");
    };

    window.saveSettings = async function() {
      const apiKey = document.getElementById("settingsApiKey").value.trim();
      const baseUrl = document.getElementById("settingsBaseUrl").value.trim();
      const privacyMode = document.getElementById("settingsPrivacyMode").value;

      const payload = { privacyMode };
      if (apiKey) payload.apiKey = apiKey;
      if (baseUrl) payload.baseUrl = baseUrl;

      try {
        const res = await fetch("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert("Settings saved successfully!");
          closeSettingsModal();
          await loadProjectInfo();
        } else {
          alert("Error: " + data.error);
        }
      } catch (err) {
        alert("Failed to save settings: " + err.message);
      }
    };

    // Start
    init();
  </script>
</body>
</html>
